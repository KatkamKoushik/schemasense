# Dependabot configuration for SchemaSense
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python Dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "KatkamKoushik"
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "pandas"
          - "streamlit"
          - "sqlalchemy"
    ignore:
      # Streamlit currently requires pandas < 3.0
      - dependency-name: "pandas"
        versions: [">= 3.0.0"]
      # Streamlit 1.66+ dropped Python 3.10 support
      - dependency-name: "streamlit"
        versions: [">= 1.66.0"]
      # SQLAlchemy 2.1+ dropped Python 3.10 distribution support
      - dependency-name: "sqlalchemy"
        versions: [">= 2.1.0"]

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "KatkamKoushik"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
